  "title": "Minimum Coin Change",
  "statement": "Find the minimum number of unlimited positive-denomination coins totaling the target, or -1 if impossible.",
  "input_format": "n target followed by n coin denominations",
  "output_format": "Minimum count integer",
  "constraints": "Input sizes up to 100000; coin-change target up to 10000. Integers fit signed 64-bit.",
  "visible_tests": [
    {
      "input": "3 6\n1 3 4\n",
      "expected_output": "2\n"
    },
